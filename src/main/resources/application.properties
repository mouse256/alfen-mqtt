## Charging controller (load management). Only the controller writes to the charger.
writer.enabled=true
%dev.writer.enabled=true
# Dry run: the controller runs and publishes its status, but nothing is written over modbus
writer.dry-run=false
# Control loop interval
writer.interval=PT5s
# Min/max charge current in A per phase
writer.min-current=6
writer.max-current=16
# Total grid-import budget in W (FAST mode never imports more than this)
writer.max-grid-power=5000
# Import above the budget for this long steps down: 3 phase -> 1 phase, or stop at 1 phase minimum
writer.over-limit-delay=PT30S
# Debounce timers
writer.start-delay=PT2M
writer.stop-delay=PT3M
writer.cooldown=PT5M
writer.phase-switch-delay=PT5M
# Extra headroom (W) above the 3-phase minimum power required before switching to 3 phase
writer.three-phase-margin=300
# PV_ONLY thresholds (W), measured as grid export/import with the car at minimum current (1 phase)
writer.solar-start-power=500
writer.solar-stop-power=1000
# Grid readings older than this are treated as unsafe
writer.input-timeout=PT1M
# MQTT topics carrying live grid power (payload in kW)
writer.grid-consumed-topic=slimmelezer/sensor/power_consumed/state
writer.grid-produced-topic=slimmelezer/sensor/power_produced/state
# SMART mode: below this battery level (%) always charge (like PV_AND_MIN)
writer.smart-min-soc=40
# SMART mode: grid import (W, with the car at min current) allowed at min-soc and at 100%, linear in between
writer.smart-grid-import-low=1000
writer.smart-grid-import-high=0
# SMART mode: stop when the import exceeds the allowed import by more than this (W)
writer.smart-stop-hysteresis=500

## Car battery level estimation. Enabled by setting the usable battery capacity (kWh).
## The estimate is published on alfen/car/<charger>/<socket>/soc_estimate.
soc.battery-capacity=77
# Battery level reported by the car (payload: percentage, preferably retained), published by e.g. Home Assistant
soc.car-soc-topic=skoda/enyaq/state/battery_percentage
# Fraction of the delivered energy that ends up in the battery
soc.efficiency=0.9
soc.interval=PT10S

mqtt.client-id=alfen-mqtt
%dev.mqtt.client-id=alfen-mqtt-dev
mqtt.enabled=true
#mqtt.host=192.168.1.152
mqtt.host=127.0.0.1
mqtt.port=1883
# Recovery tuning for a silently broken broker connection (see MqttConfig).
mqtt.ack-timeout-seconds=30
mqtt.keep-alive-seconds=30
mqtt.max-publish-failures=20

# Liveness thresholds, exposed at GET /health, /health/live (503 = restart me). See HealthConfig.
health.startup-grace=PT1M
health.modbus-poll-stale-limit=PT2M
health.modbus-poll-stall-limit=PT2M
health.mqtt-publish-stale-limit=PT2M

